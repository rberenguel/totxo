<!DOCTYPE html>
<html lang="en">
<head>
    <title>3D Block Breaker</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevents pull-to-refresh and other touch gestures */
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display: block;
            font-size: 1.5rem;
            text-shadow: 0 0 8px #000;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 101;
            display: none;
            background-color: rgba(10, 10, 10, 0.85);
            padding: 2rem 3rem;
            border-radius: 1rem;
            text-align: center;
            border: 1px solid #444;
        }
        #gameover h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        #gameover button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        #gameover button:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>
    <div id="info">Score: <span id="score">0</span> | Blocks: <span id="blocks-left">0</span></div>
    <div id="gameover">
        <h1>Game Over</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="restartButton">Restart</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const TUBE_WIDTH = 100;
        const TUBE_HEIGHT = 80;
        const TUBE_DEPTH = 300;

        const BLOCK_GRID_X = 8;
        const BLOCK_GRID_Y = 6;
        const BLOCK_GRID_Z = 4;

        const BLOCK_SIZE = new THREE.Vector3(TUBE_WIDTH / BLOCK_GRID_X, TUBE_HEIGHT / BLOCK_GRID_Y, 15);
        const BALL_RADIUS = 4;
        const PADDLE_SIZE = new THREE.Vector3(20, 20, 5);
        const BALL_INITIAL_SPEED = 150;
        const SPECIAL_BLOCK_CHANCE = 0.20; // 20% chance for a block to be special
        const POWERUP_DURATION = 10; // 10 seconds for all powerups

        // --- Game State ---
        let scene, camera, renderer, clock;
        let balls = [], blocks = [], particles = [], powerUps = [];
        let paddle, timerBar;
        let score = 0;
        let isGameActive = true;
        let totalBlocks = 0;
        let screenShake = { intensity: 0, duration: 0, timer: 0 };
        let touchStart = { x: 0, y: 0 };
        let paddleStart = { x: 0, y: 0 };
        let paddleEffect = { shineTimer: 0, wobbleTimer: 0 };
        const PADDLE_EFFECT_DURATION = 0.4; // seconds for both effects
        let powerUpState = { widePaddleTimer: 0, shrinkPaddleTimer: 0 };

        // --- DOM Elements ---
        const scoreElement = document.getElementById('score');
        const blocksLeftElement = document.getElementById('blocks-left');
        const gameOverElement = document.getElementById('gameover');
        const finalScoreElement = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');

        function init() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            // Camera looking down the tube
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, TUBE_DEPTH / 2 + 50);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.HemisphereLight(0xcccccc, 0x444444, 1.2));
            const pointLight = new THREE.PointLight(0xffffff, 1.5, 1000);
            pointLight.position.set(0, 20, TUBE_DEPTH / 2 + 30);
            pointLight.castShadow = true;
            scene.add(pointLight);

            createWorld();
            resetGame();
            addEventListeners();
            animate();
        }

        function createWorld() {
            // Create tube grid lines
            const gridGroup = new THREE.Group();
            const gridMaterial = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.15 });
            
            // Transverse rings
            for(let i = 0; i <= 10; i++) {
                const z = -TUBE_DEPTH / 2 + (i / 10) * TUBE_DEPTH;
                const points = [
                    new THREE.Vector3(-TUBE_WIDTH/2, -TUBE_HEIGHT/2, z), new THREE.Vector3(TUBE_WIDTH/2, -TUBE_HEIGHT/2, z),
                    new THREE.Vector3(TUBE_WIDTH/2, -TUBE_HEIGHT/2, z), new THREE.Vector3(TUBE_WIDTH/2, TUBE_HEIGHT/2, z),
                    new THREE.Vector3(TUBE_WIDTH/2, TUBE_HEIGHT/2, z), new THREE.Vector3(-TUBE_WIDTH/2, TUBE_HEIGHT/2, z),
                    new THREE.Vector3(-TUBE_WIDTH/2, TUBE_HEIGHT/2, z), new THREE.Vector3(-TUBE_WIDTH/2, -TUBE_HEIGHT/2, z),
                ];
                gridGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), gridMaterial));
            }

            // Longitudinal lines spaced like blocks
            for (let i = 0; i <= BLOCK_GRID_X; i++) {
                const x = -TUBE_WIDTH / 2 + i * BLOCK_SIZE.x;
                const points = [
                    new THREE.Vector3(x, -TUBE_HEIGHT / 2, -TUBE_DEPTH / 2), // bottom line
                    new THREE.Vector3(x, -TUBE_HEIGHT / 2, TUBE_DEPTH / 2),
                    new THREE.Vector3(x, TUBE_HEIGHT / 2, -TUBE_DEPTH / 2),  // top line
                    new THREE.Vector3(x, TUBE_HEIGHT / 2, TUBE_DEPTH / 2)
                ];
                gridGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points), gridMaterial));
            }

            for (let i = 0; i <= BLOCK_GRID_Y; i++) {
                const y = -TUBE_HEIGHT / 2 + i * BLOCK_SIZE.y;
                const points = [
                    new THREE.Vector3(-TUBE_WIDTH / 2, y, -TUBE_DEPTH / 2), // left line
                    new THREE.Vector3(-TUBE_WIDTH / 2, y, TUBE_DEPTH / 2),
                    new THREE.Vector3(TUBE_WIDTH / 2, y, -TUBE_DEPTH / 2),  // right line
                    new THREE.Vector3(TUBE_WIDTH / 2, y, TUBE_DEPTH / 2)
                ];
                gridGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(points), gridMaterial));
            }
            
            scene.add(gridGroup);

            // Paddle
            const paddleRadius = 4;
            const paddleShape = createRoundedRectShape(PADDLE_SIZE.x, PADDLE_SIZE.y, paddleRadius);
            const extrudeSettings = {
                steps: 1, depth: PADDLE_SIZE.z, bevelEnabled: true,
                bevelThickness: 1, bevelSize: 1, bevelOffset: -1, bevelSegments: 8
            };
            const paddleGeometry = new THREE.ExtrudeGeometry(paddleShape, extrudeSettings);
            paddleGeometry.center();

            const paddleMaterial = new THREE.MeshStandardMaterial({ color: 0x0d6efd, metalness: 0.6, roughness: 0.2, transparent: true, opacity: 0.6 });
            paddle = new THREE.Mesh(paddleGeometry, paddleMaterial);
            paddle.position.z = TUBE_DEPTH / 2 - 20;
            paddle.castShadow = true;
            scene.add(paddle);

            // Timer Bar for power-ups
            const timerBarGeo = new THREE.BoxGeometry(PADDLE_SIZE.x, 2, PADDLE_SIZE.z + 0.1);
            const timerBarMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            timerBar = new THREE.Mesh(timerBarGeo, timerBarMat);
            timerBar.position.y = PADDLE_SIZE.y / 2 + 2; // Position on top of the paddle
            timerBar.visible = false;
            paddle.add(timerBar); // Add as child to move with paddle
        }
        
        function createBall(position, velocity) {
            const ballMaterial = new THREE.MeshStandardMaterial({ color: 0xcccc00, roughness: 0.5 });
            const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_RADIUS, 32, 32), ballMaterial);
            ball.castShadow = true;
            ball.position.copy(position);
            ball.userData.velocity = velocity;
            balls.push(ball);
            scene.add(ball);
        }

        function createBlocks() {
            blocks.forEach(block => scene.remove(block));
            blocks = [];

            const blockGeo = new THREE.BoxGeometry(BLOCK_SIZE.x * 0.9, BLOCK_SIZE.y * 0.9, BLOCK_SIZE.z * 0.9);
            totalBlocks = 0;

            for (let z = 0; z < BLOCK_GRID_Z; z++) {
                for (let y = 0; y < BLOCK_GRID_Y; y++) {
                    for (let x = 0; x < BLOCK_GRID_X; x++) {
                        const block = new THREE.Mesh(blockGeo);
                        
                        if (Math.random() < SPECIAL_BLOCK_CHANCE) {
                           block.material = new THREE.MeshStandardMaterial({
                                color: 0xffffff, metalness: 0.8, roughness: 0.2,
                                emissive: 0xaaaaaa, emissiveIntensity: 0.5
                            });
                            block.userData.isSpecial = true;
                            const rand = Math.random();
                            if (rand < 0.33) block.userData.powerUpType = 'widePaddle';
                            else if (rand < 0.66) block.userData.powerUpType = 'multiBall';
                            else block.userData.powerUpType = 'shrinkPaddle';
                        } else {
                            const hue = z / BLOCK_GRID_Z;
                            block.material = new THREE.MeshStandardMaterial({
                                color: new THREE.Color().setHSL(hue, 0.8, 0.6),
                                metalness: 0.1, roughness: 0.5
                            });
                        }
                        
                        block.position.set(
                            (x - (BLOCK_GRID_X - 1) / 2) * BLOCK_SIZE.x,
                            (y - (BLOCK_GRID_Y - 1) / 2) * BLOCK_SIZE.y,
                            -TUBE_DEPTH / 2 + (z + 1.5) * BLOCK_SIZE.z
                        );
                        block.castShadow = true;
                        blocks.push(block);
                        scene.add(block);
                        totalBlocks++;
                    }
                }
            }
        }
        
        function createRoundedRectShape(width, height, radius) {
            const shape = new THREE.Shape();
            const x = -width / 2, y = -height / 2;
            shape.moveTo(x, y + radius);
            shape.lineTo(x, y + height - radius);
            shape.quadraticCurveTo(x, y + height, x + radius, y + height);
            shape.lineTo(x + width - radius, y + height);
            shape.quadraticCurveTo(x + width, y + height, x + width, y + height - radius);
            shape.lineTo(x + width, y + radius);
            shape.quadraticCurveTo(x + width, y, x + width - radius, y);
            shape.lineTo(x + radius, y);
            shape.quadraticCurveTo(x, y, x, y + radius);
            return shape;
        }

        function resetGame() {
            isGameActive = true;
            score = 0;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';

            balls.forEach(b => scene.remove(b));
            balls = [];
            powerUps.forEach(p => scene.remove(p));
            powerUps = [];
            powerUpState.widePaddleTimer = 0;
            powerUpState.shrinkPaddleTimer = 0;
            paddle.scale.x = 1;

            createBlocks();
            blocksLeftElement.textContent = totalBlocks;
            
            const initialPos = new THREE.Vector3(0, 0, paddle.position.z - PADDLE_SIZE.z / 2 - BALL_RADIUS - 1);
            const initialAngleX = (Math.random() - 0.5) * 0.5;
            const initialAngleY = (Math.random() - 0.5) * 0.5;
            const initialVel = new THREE.Vector3(initialAngleX, initialAngleY, -1).normalize().multiplyScalar(BALL_INITIAL_SPEED);
            createBall(initialPos, initialVel);
        }
        
        function createPowerUp(position, type) {
            let color;
            if (type === 'widePaddle') color = 0x00ff00; // green
            else if (type === 'multiBall') color = 0xcc00ff; // purple
            else if (type === 'shrinkPaddle') color = 0xff0000; // red
            
            const powerUpGeo = new THREE.BoxGeometry(5, 5, 5);
            const powerUpMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.5 });
            const powerUp = new THREE.Mesh(powerUpGeo, powerUpMat);
            powerUp.position.copy(position);
            powerUp.userData.type = type;
            powerUp.userData.velocity = new THREE.Vector3(0, 0, 50);
            
            powerUps.push(powerUp);
            scene.add(powerUp);
        }

        function activatePowerUp(type) {
            if (type === 'widePaddle') {
                powerUpState.widePaddleTimer = POWERUP_DURATION;
                powerUpState.shrinkPaddleTimer = 0; // Cancel negative effect
                paddle.scale.x = 1.5;
            } else if (type === 'shrinkPaddle') {
                powerUpState.shrinkPaddleTimer = POWERUP_DURATION;
                powerUpState.widePaddleTimer = 0; // Cancel positive effect
                paddle.scale.x = 0.5;
            } else if (type === 'multiBall' && balls.length > 0) {
                const originalBall = balls[0];
                const pos = originalBall.position.clone();
                const vel = originalBall.userData.velocity.clone();
                createBall(pos, vel.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.3));
                createBall(pos, vel.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -0.3));
            }
        }
        
        function createExplosion(position, color) {
            const particleCount = 20;
            const particleGeo = new THREE.BufferGeometry();
            const positions = [];
            const material = new THREE.PointsMaterial({
                color, size: 1.5, blending: THREE.AdditiveBlending,
                transparent: true, sizeAttenuation: true,
            });

            for (let i = 0; i < particleCount; i++) positions.push(position.x, position.y, position.z);
            particleGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            
            const particleSystem = new THREE.Points(particleGeo, material);
            particleSystem.userData = { velocities: [], life: 1.0 };

            for (let i = 0; i < particleCount; i++) {
                particleSystem.userData.velocities.push(new THREE.Vector3(
                    (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40
                ));
            }
            particles.push(particleSystem);
            scene.add(particleSystem);
        }
        
        function triggerScreenShake(intensity, duration) {
            screenShake.intensity = intensity;
            screenShake.duration = duration;
            screenShake.timer = 0;
        }

        function handleCollisions() {
            const paddleBox = new THREE.Box3().setFromObject(paddle);

            for (let b = balls.length - 1; b >= 0; b--) {
                const ball = balls[b];
                const ballVelocity = ball.userData.velocity;

                if (Math.abs(ball.position.x) > TUBE_WIDTH / 2 - BALL_RADIUS) ballVelocity.x *= -1;
                if (Math.abs(ball.position.y) > TUBE_HEIGHT / 2 - BALL_RADIUS) ballVelocity.y *= -1;
                if (ball.position.z < -TUBE_DEPTH / 2 + BALL_RADIUS) ballVelocity.z *= -1;

                const ballBox = new THREE.Box3().setFromObject(ball);
                if (ballVelocity.z > 0 && ballBox.intersectsBox(paddleBox)) {
                    triggerScreenShake(0.5, 0.2);
                    paddleEffect.shineTimer = PADDLE_EFFECT_DURATION;
                    paddleEffect.wobbleTimer = PADDLE_EFFECT_DURATION;
                    ballVelocity.z *= -1.02;

                    const paddleRadius = 4;
                    const flatWidth = (PADDLE_SIZE.x * paddle.scale.x) - 2 * paddleRadius;
                    const flatHeight = PADDLE_SIZE.y - 2 * paddleRadius;
                    const hitPointX = ball.position.x - paddle.position.x;
                    const hitPointY = ball.position.y - paddle.position.y;

                    if (Math.abs(hitPointX) < flatWidth / 2 && Math.abs(hitPointY) < flatHeight / 2) {
                        ballVelocity.x += hitPointX * 0.1;
                        ballVelocity.y += hitPointY * 0.1;
                    } else {
                        ballVelocity.x += hitPointX * 0.2; 
                        ballVelocity.y += hitPointY * 0.2;
                    }
                    ballVelocity.normalize().multiplyScalar(BALL_INITIAL_SPEED);
                }

                for (let i = blocks.length - 1; i >= 0; i--) {
                    const block = blocks[i];
                    const blockBox = new THREE.Box3().setFromObject(block);
                    if (ballBox.intersectsBox(blockBox)) {
                        if (block.userData.isSpecial) {
                            createPowerUp(block.position.clone(), block.userData.powerUpType);
                        }
                        createExplosion(block.position.clone(), block.material.color);
                        scene.remove(block);
                        blocks.splice(i, 1);
                        
                        const ballCenter = ball.position.clone();
                        const blockCenter = block.position.clone();
                        const delta = ballCenter.sub(blockCenter);
                        const halfSize = new THREE.Vector3(BLOCK_SIZE.x / 2, BLOCK_SIZE.y / 2, BLOCK_SIZE.z / 2);
                        const dx = Math.abs(delta.x) / halfSize.x;
                        const dy = Math.abs(delta.y) / halfSize.y;
                        const dz = Math.abs(delta.z) / halfSize.z;
                        
                        if (dx > dy && dx > dz) ballVelocity.x *= -1;
                        else if (dy > dx && dy > dz) ballVelocity.y *= -1;
                        else ballVelocity.z *= -1;
                        
                        score += 10;
                        scoreElement.textContent = score;
                        blocksLeftElement.textContent = blocks.length;
                        break; 
                    }
                }
            }

            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                const powerUpBox = new THREE.Box3().setFromObject(powerUp);
                if (powerUpBox.intersectsBox(paddleBox)) {
                    activatePowerUp(powerUp.userData.type);
                    scene.remove(powerUp);
                    powerUps.splice(i, 1);
                } else if (powerUp.position.z > TUBE_DEPTH / 2) {
                    scene.remove(powerUp);
                    powerUps.splice(i, 1);
                }
            }

            if (balls.length === 0 && isGameActive) {
                isGameActive = false;
                finalScoreElement.textContent = score;
                gameOverElement.querySelector('h1').textContent = "Game Over";
                gameOverElement.style.display = 'block';
            } else if (blocks.length === 0 && isGameActive) {
                 isGameActive = false;
                 finalScoreElement.textContent = score;
                 gameOverElement.querySelector('h1').textContent = "You Win!";
                 gameOverElement.style.display = 'block';
            }
        }

        function addEventListeners() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            window.addEventListener('mousemove', (event) => movePaddle((event.clientX/window.innerWidth)*2-1, -(event.clientY/window.innerHeight)*2+1));
            window.addEventListener('touchstart', (event) => {
                touchStart.x = event.touches[0].clientX;
                touchStart.y = event.touches[0].clientY;
                paddleStart.x = paddle.position.x;
                paddleStart.y = paddle.position.y;
            });
            window.addEventListener('touchmove', (event) => {
                const deltaX = (event.touches[0].clientX - touchStart.x) / window.innerWidth * TUBE_WIDTH;
                const deltaY = (event.touches[0].clientY - touchStart.y) / window.innerHeight * TUBE_HEIGHT;
                const paddleLimitX = TUBE_WIDTH / 2 - (PADDLE_SIZE.x * paddle.scale.x) / 2;
                const paddleLimitY = TUBE_HEIGHT / 2 - PADDLE_SIZE.y / 2;
                paddle.position.x = THREE.MathUtils.clamp(paddleStart.x + deltaX, -paddleLimitX, paddleLimitX);
                paddle.position.y = THREE.MathUtils.clamp(paddleStart.y - deltaY, -paddleLimitY, paddleLimitY);
            });
            restartButton.addEventListener('click', resetGame);
        }
        
        function movePaddle(normX, normY) {
            const paddleLimitX = TUBE_WIDTH / 2 - (PADDLE_SIZE.x * paddle.scale.x) / 2;
            const paddleLimitY = TUBE_HEIGHT / 2 - PADDLE_SIZE.y / 2;
            paddle.position.x = THREE.MathUtils.clamp(normX * (TUBE_WIDTH / 2), -paddleLimitX, paddleLimitX);
            paddle.position.y = THREE.MathUtils.clamp(normY * (TUBE_HEIGHT / 2), -paddleLimitY, paddleLimitY);
        }

        function updatePowerUpTimers(delta) {
            let timerIsActive = false;
            let progress = 0;

            if (powerUpState.widePaddleTimer > 0) {
                powerUpState.widePaddleTimer -= delta;
                timerIsActive = true;
                progress = powerUpState.widePaddleTimer / POWERUP_DURATION;
                timerBar.material.color.setHex(0x00ff00); // Green
                if (powerUpState.widePaddleTimer <= 0) {
                    paddle.scale.x = 1;
                }
            } else if (powerUpState.shrinkPaddleTimer > 0) {
                powerUpState.shrinkPaddleTimer -= delta;
                timerIsActive = true;
                progress = powerUpState.shrinkPaddleTimer / POWERUP_DURATION;
                timerBar.material.color.setHex(0xff0000); // Red
                if (powerUpState.shrinkPaddleTimer <= 0) {
                    paddle.scale.x = 1;
                }
            }

            if (timerIsActive) {
                timerBar.visible = true;
                timerBar.scale.x = Math.max(0, progress);
                // This formula keeps the bar left-aligned as it shrinks
                timerBar.position.x = - (1 - Math.max(0, progress)) * PADDLE_SIZE.x / 2;
            } else {
                timerBar.visible = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (isGameActive) {
                updatePowerUpTimers(delta);

                for (let i = balls.length - 1; i >= 0; i--) {
                    const ball = balls[i];
                    ball.position.add(ball.userData.velocity.clone().multiplyScalar(delta));
                    if (ball.position.z > TUBE_DEPTH / 2 + 20) {
                        scene.remove(ball);
                        balls.splice(i, 1);
                    }
                }
                
                powerUps.forEach(p => {
                    p.position.add(p.userData.velocity.clone().multiplyScalar(delta));
                    p.rotation.x += delta * 2;
                    p.rotation.y += delta * 2;
                });

                handleCollisions();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const ps = particles[i];
                ps.userData.life -= delta;
                if (ps.userData.life <= 0) {
                    scene.remove(ps);
                    particles.splice(i, 1);
                } else {
                    const positions = ps.geometry.attributes.position.array;
                    for (let j = 0; j < ps.userData.velocities.length; j++) {
                        positions[j*3] += ps.userData.velocities[j].x * delta;
                        positions[j*3+1] += ps.userData.velocities[j].y * delta;
                        positions[j*3+2] += ps.userData.velocities[j].z * delta;
                    }
                    ps.geometry.attributes.position.needsUpdate = true;
                    ps.material.opacity = ps.userData.life;
                }
            }
            
            if (paddleEffect.shineTimer > 0) {
                paddleEffect.shineTimer -= delta;
                const shineProgress = paddleEffect.shineTimer / PADDLE_EFFECT_DURATION;
                const intensity = Math.sin(shineProgress * Math.PI) * 0.5;
                paddle.material.emissive.setHex(0xbbddff).multiplyScalar(intensity);
            } else {
                paddle.material.emissive.setHex(0x000000);
            }

            if (paddleEffect.wobbleTimer > 0) {
                paddleEffect.wobbleTimer -= delta;
                const wobbleProgress = paddleEffect.wobbleTimer / PADDLE_EFFECT_DURATION;
                const wobbleAmount = Math.sin(wobbleProgress * Math.PI * 4) * (wobbleProgress * 0.06);
                paddle.rotation.z = wobbleAmount;
                paddle.rotation.x = -wobbleAmount;
            } else {
                paddle.rotation.set(0,0,0);
            }

            if (screenShake.timer < screenShake.duration) {
                screenShake.timer += delta;
                const shake = (Math.random() - 0.5) * screenShake.intensity * (1 - screenShake.timer/screenShake.duration);
                camera.position.x += shake;
                camera.position.y += shake;
            } else if (camera.position.x !== 0 || camera.position.y !== 0) {
                 camera.position.x = 0;
                 camera.position.y = 0;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
