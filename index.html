<!doctype html>
<html lang="en">
  <head>
    <title>Totxo</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="manifest.json" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        color: white;
        font-family: "Inter", sans-serif;
        touch-action: none; /* Prevents pull-to-refresh and other touch gestures */
      }
      canvas {
        display: block;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
        display: none; /* Hidden by default */
        font-size: 0.8rem;
        text-shadow: 0 0 8px #000;
      }
      .modal {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 101;
        background-color: rgba(10, 20, 40, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 2rem 4rem;
        border-radius: 1rem;
        text-align: center;
        border: 2px solid #00ffff;
        box-shadow:
          0 0 25px rgba(0, 255, 255, 0.6),
          inset 0 0 15px rgba(0, 255, 255, 0.4);
        /*width: 60vw;*/
      }
      .modal h1 {
        font-family: "SixtyFour", sans-serif;
        font-size: 2rem;
        margin-bottom: 1rem;
        color: #fff;
        text-shadow:
          0 0 2px #fff,
          0 0 4px #fff,
          0 0 8px #00ffff,
          0 0 16px #00ffff;
      }
      .modal button {
        background-color: rgba(0, 255, 255, 0.1);
        color: #00ffff;
        border: 2px solid #00ffff;
        padding: 1rem 2.5rem;
        border-radius: 0.5rem;
        font-size: 1.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        text-shadow: 0 0 5px #00ffff;
      }
      .modal button:hover {
        background-color: rgba(0, 255, 255, 0.3);
        box-shadow: 0 0 15px #00ffff;
      }
      #startModal {
        display: block;
      }
      #gameover {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Score: <span id="score">0</span> | Blocks: <span id="blocks-left">0</span>
    </div>

    <div id="startModal" class="modal">
      <h1>Totxo</h1>
      <button id="playButton">Play</button>
      <div>
        <p>Drag or use your mouse to move the paddle</p>
        <p>Quickly move your paddle when hitting to add spin to the ball</p>
				<p>If the spin is high enough you can smash through blocks</p>
      </div>
    </div>

    <div id="gameover" class="modal">
      <h1 id="gameOverTitle">Game Over</h1>
      <p>Final Score: <span id="finalScore">0</span></p>
      <button id="restartButton">Play Again</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three.module.js"
        }
      }
    </script>

    <script type="module" src="totxo.js"></script>
  </body>
</html>
